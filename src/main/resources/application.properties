# 沿用原来的端口和环境变量；本地凭据文件不纳入版本管理。
spring.config.import=optional:file:.env.local[.properties]
server.port=4242
app.base-url=${APP_BASE_URL:http://localhost:4242}
# 自动混合模式允许本地数据库工具与应用共享同一个文件库。
app.order-db-url=${ORDER_DB_URL:jdbc:h2:./data/orders;AUTO_SERVER=TRUE}
app.stripe-api-key=${STRIPE_API_KEY}
app.stripe-webhook-secret=${STRIPE_WEBHOOK_SECRET}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
